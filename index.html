<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Resume Analyzer</h1>

        <p>Upload your resume to analyze your skills and get a job role recommendation.</p>

        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <label>Select Resume</label>

            <input type="file"
                   name="resume"
                   accept=".pdf,.doc,.docx"
                   required>

            <br><br>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

</body>

</html>
